<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いんふぉめ〜しょん</title>
<style>
  :root{
    --blue:#0000ee; --sky:#7ec8f7; --lav:#b9a7ff; --ink:#101018; --paper:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    color:var(--ink); background:var(--paper);
    min-height:100vh; display:flex; flex-direction:column;
  }
  .mono{font-family:"Courier New",monospace;}

  /* ===== ハンバーガーメニュー（SP幅のみ） ===== */
  .burger{
    display:none; position:fixed; top:12px; right:14px; z-index:60;
    width:46px; height:46px; border-radius:50%; border:2px solid var(--blue);
    background:#fff; cursor:pointer; padding:0;
  }
  .burger span{display:block; width:20px; height:2px; background:var(--blue); margin:5px auto; transition:transform .25s ease, opacity .2s ease;}
  .burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .burger.open span:nth-child(2){opacity:0;}
  .burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
  .spmenu{
    display:flex; position:fixed; inset:0; z-index:55; background:var(--blue);
    flex-direction:column; align-items:center; justify-content:center; gap:34px;
    clip-path:circle(0% at calc(100% - 37px) 35px); visibility:hidden;
    transition:clip-path .38s ease-in, visibility 0s .38s;
  }
  .spmenu.open{
    clip-path:circle(142% at calc(100% - 37px) 35px); visibility:visible;
    transition:clip-path .7s cubic-bezier(.3,1.45,.5,1), visibility 0s;
  }
  .spmenu a{
    color:#fff; text-decoration:none; font-weight:900; font-size:26px; letter-spacing:.08em;
    opacity:0; transform:translateY(30px) scale(.85);
  }
  .spmenu.open a{opacity:1; transform:translateY(0) scale(1); transition:opacity .3s ease, transform .55s cubic-bezier(.3,1.8,.5,1);}
  .spmenu.open a:nth-child(2){transition-delay:.08s;}
  .spmenu.open a:nth-child(3){transition-delay:.16s;}
  .spmenu a .en{display:block; text-align:center; font-size:11px; font-weight:400; letter-spacing:.3em; margin-top:4px;}
  @media (max-width:640px){ .burger{display:block;} }

  /* ===== トップ ===== */
  main{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:60px 20px 40px; max-width:600px; margin:0 auto; width:100%;
  }
  .label{color:var(--blue); font-size:12.5px; letter-spacing:.22em; font-weight:700;}
  h1{
    color:var(--blue); font-size:clamp(34px,8.5vw,54px); font-weight:900;
    letter-spacing:.04em; line-height:1.2; margin:10px 0 6px; position:relative; display:inline-block;
  }
  .glitch::before,.glitch::after{content:attr(data-text); position:absolute; inset:0; overflow:hidden;}
  .glitch::before{color:var(--sky); animation:gl1 2.8s infinite steps(1);}
  .glitch::after{color:var(--lav); animation:gl2 3.4s infinite steps(1);}
  @keyframes gl1{0%,92%{transform:none; opacity:0;}
    93%{transform:translate(-4px,2px); clip-path:inset(12% 0 55% 0); opacity:.9;}
    96%{transform:translate(3px,-1px); clip-path:inset(60% 0 8% 0); opacity:.9;}
    99%,100%{transform:none; opacity:0;}}
  @keyframes gl2{0%,90%{transform:none; opacity:0;}
    91%{transform:translate(4px,1px); clip-path:inset(40% 0 30% 0); opacity:.8;}
    95%{transform:translate(-3px,-2px); clip-path:inset(5% 0 78% 0); opacity:.8;}
    98%,100%{transform:none; opacity:0;}}
  .en{font-size:11px; letter-spacing:.35em; text-transform:uppercase; color:#55556a;}
  .who{margin-top:20px; font-size:14.5px; line-height:2; color:#22222e;}
  .links{display:flex; flex-direction:column; gap:14px; margin-top:36px; width:min(320px,84vw);}
  .btn{
    display:block; text-align:center; text-decoration:none; font-weight:800; letter-spacing:.06em;
    padding:16px 18px; border-radius:999px; color:#fff; background:var(--blue);
    border:2px solid var(--blue); transition:all .18s ease;
  }
  .btn:hover{background:#fff; color:var(--blue); transform:translateY(-2px);}
  .btn.ghost{background:#fff; color:var(--blue);}
  .btn.ghost:hover{background:var(--blue); color:#fff;}
  .fade{opacity:0; transform:translateY(20px); animation:fadeUp .8s ease forwards;}
  .fade.d1{animation-delay:.1s;} .fade.d2{animation-delay:.22s;} .fade.d3{animation-delay:.34s;}
  @keyframes fadeUp{to{opacity:1; transform:translateY(0);}}
  footer{border-top:2px solid var(--blue); padding:22px 20px 34px; text-align:center;}
  footer .copy{font-size:12px; color:#55556a; letter-spacing:.1em;}
</style>
</head>
<body>

<button class="burger" id="burger" aria-label="メニュー"><span></span><span></span><span></span></button>
<nav class="spmenu" id="spmenu">
  <a href="index.html">トップ<span class="en mono">TOP</span></a>
  <a href="about.html">わたしについて<span class="en mono">ABOUT ME</span></a>
  <a href="char_info.html">マイキャラ紹介<span class="en mono">MY CHARACTER</span></a>
</nav>

<main>
  <p class="label fade">( qurage_waon )</p>
  <h1 class="glitch fade d1" data-text="いんふぉめ〜しょん">いんふぉめ〜しょん</h1>
  <p class="en mono fade d1">information</p>
  <p class="who fade d2">
    あいぷりおじさん ‧⁺ ⊹˚.⋆₍ᐢ.ˬ.ᐢ₎˖ ࣪⊹ ‧⁺<br>
    アイコンは @mawhip_n さま♡*゜
  </p>
  <div class="links fade d3">
    <a class="btn" href="about.html">わたしについて</a>
    <a class="btn ghost" href="char_info.html">マイキャラ紹介</a>
  </div>
</main>

<footer>
  <p class="copy">© qurage_waon / watagi-ch.github.io</p>
</footer>

<script>
  (function(){
    var burger = document.getElementById('burger');
    var menu = document.getElementById('spmenu');
    burger.addEventListener('click', function(){
      burger.classList.toggle('open');
      menu.classList.toggle('open');
    });
    menu.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        burger.classList.remove('open');
        menu.classList.remove('open');
      });
    });
  })();
</script>
</body>
</html>
